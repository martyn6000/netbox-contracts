# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-contracts"
version = "1.7"
authors = [
  { name="Martyn Stanton", email="martynstanton@hotmail.com" },
]

description = "Contract management plugin for Netbox"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    'python-dateutil',
    'drf_yasg',
    'Django',
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["check-manifest", "mkdocs", "mkdocs-material", "ruff"]
test = ["coverage", "pytest", "pytest-cov"]

[project.urls]
"Homepage" = "https://github.com/martyn6000/netbox-contracts"
"Bug Tracker" = "https://github.com/martyn6000/netbox-contracts/issues"

[tool.setuptools]
packages = [
    "netbox_contracts",
]
package-data = { "netbox_contracts" = ["**/*", "templates/**"] }
exclude-package-data = { netbox_contracts = ["tests/*"] }
license-files = ["LICENSE"]